<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiscal Calendar Grid Visualization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .controls label {
            font-weight: bold;
            margin-right: 5px;
        }
        .controls select, .controls input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .quarter {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        .quarter-header {
            background-color: #3498db;
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
        .month-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background-color: #f9f9f9;
        }
        .month {
            border: 1px solid #eee;
            padding: 10px;
        }
        .month-header {
            background-color: #f2f2f2;
            padding: 5px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #ddd;
        }
        .weeks {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
        }
        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            border: 1px solid #f0f0f0;
        }
        .day.weekend {
            background-color: #f9f9f9;
            color: #999;
        }
        .day.today {
            background-color: #3498db;
            color: white;
            font-weight: bold;
        }
        .day.holiday {
            background-color: #e74c3c;
            color: white;
        }
        .day.fiscal-start {
            border: 2px solid #27ae60;
        }
        .day.fiscal-end {
            border: 2px solid #e67e22;
        }
        .legend {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }
        .tooltip {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fiscal Calendar Visualization</h1>
        
        <div class="controls">
            <div>
                <label for="fiscal-year">Fiscal Year:</label>
                <select id="fiscal-year"></select>
            </div>
            <div>
                <label for="fiscal-start-month">Start Month:</label>
                <select id="fiscal-start-month">
                    <option value="0">January</option>
                    <option value="1">February</option>
                    <option value="2">March</option>
                    <option value="3">April</option>
                    <option value="4">May</option>
                    <option value="5">June</option>
                    <option value="6">July</option>
                    <option value="7">August</option>
                    <option value="8">September</option>
                    <option value="9" selected>October</option>
                    <option value="10">November</option>
                    <option value="11">December</option>
                </select>
            </div>
            <div>
                <label for="fiscal-start-day">Start Day:</label>
                <input type="number" id="fiscal-start-day" min="1" max="31" value="1">
            </div>
            <div>
                <label for="preset">Preset:</label>
                <select id="preset">
                    <option value="">Custom</option>
                    <option value="us-federal">US Federal Government</option>
                    <option value="uk-standard">UK Standard</option>
                    <option value="australia">Australia</option>
                    <option value="india">India</option>
                    <option value="japan">Japan</option>
                    <option value="canada">Canada</option>
                    <option value="calendar-year">Calendar Year</option>
                </select>
            </div>
            <button id="update-calendar">Update Calendar</button>
        </div>
        
        <div id="calendar-grid" class="calendar-grid">
            <!-- Calendar will be generated here -->
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background-color: #f9f9f9;"></div>
                <span>Weekend</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #3498db;"></div>
                <span>Today</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #e74c3c;"></div>
                <span>Holiday</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="border: 2px solid #27ae60; width: 11px; height: 11px;"></div>
                <span>Fiscal Year Start</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="border: 2px solid #e67e22; width: 11px; height: 11px;"></div>
                <span>Fiscal Year End</span>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script src="https://cdn.jsdelivr.net/npm/fiscal-year-calendar@3.0.0/dist/fiscal-year-calendar.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize fiscal year dropdown
            const fiscalYearSelect = document.getElementById('fiscal-year');
            const currentYear = new Date().getFullYear();
            
            for (let year = currentYear - 5; year <= currentYear + 5; year++) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                if (year === currentYear) {
                    option.selected = true;
                }
                fiscalYearSelect.appendChild(option);
            }
            
            // Initialize preset dropdown
            const presetSelect = document.getElementById('preset');
            presetSelect.addEventListener('change', function() {
                const preset = this.value;
                if (preset) {
                    const presetConfig = fiscalYearCalendar.FISCAL_YEAR_PRESETS[preset];
                    if (presetConfig) {
                        document.getElementById('fiscal-start-month').value = presetConfig.fyStartMonth;
                        document.getElementById('fiscal-start-day').value = presetConfig.fyStartDay;
                    }
                }
            });
            
            // Update calendar button
            document.getElementById('update-calendar').addEventListener('click', generateCalendar);
            
            // Generate calendar on page load
            generateCalendar();
            
            // Tooltip functionality
            const tooltip = document.getElementById('tooltip');
            document.addEventListener('mousemove', function(e) {
                tooltip.style.left = (e.pageX + 15) + 'px';
                tooltip.style.top = (e.pageY + 15) + 'px';
            });
            
            function generateCalendar() {
                const fiscalYear = parseInt(document.getElementById('fiscal-year').value);
                const fyStartMonth = parseInt(document.getElementById('fiscal-start-month').value);
                const fyStartDay = parseInt(document.getElementById('fiscal-start-day').value);
                
                // Get fiscal year data
                const config = {
                    year: fiscalYear,
                    fyStartMonth: fyStartMonth,
                    fyStartDay: fyStartDay
                };
                
                // Get quarters and months
                const quarters = fiscalYearCalendar.getQuarterOptions(
                    fiscalYearCalendar.START_OF_WEEK.monday.value,
                    null,
                    fiscalYear,
                    fyStartMonth,
                    fyStartDay
                );
                
                const months = fiscalYearCalendar.getMonthOptions(
                    fiscalYearCalendar.START_OF_WEEK.monday.value,
                    null,
                    fiscalYear,
                    fyStartMonth,
                    fyStartDay
                );
                
                // Get fiscal year start and end dates
                const startDate = fiscalYearCalendar.getStartDate(
                    null,
                    fiscalYear,
                    fiscalYearCalendar.START_OF_WEEK.monday.value,
                    fyStartMonth,
                    fyStartDay
                );
                
                const endDate = fiscalYearCalendar.getEndDate(
                    null,
                    fiscalYear,
                    fiscalYearCalendar.START_OF_WEEK.monday.value,
                    fyStartMonth,
                    fyStartDay
                );
                
                // Generate calendar grid
                const calendarGrid = document.getElementById('calendar-grid');
                calendarGrid.innerHTML = '';
                
                // Group months by quarter
                const monthsByQuarter = {};
                months.forEach(month => {
                    const quarterNum = Math.floor((parseInt(month.month) - 1) / 3) + 1;
                    if (!monthsByQuarter[quarterNum]) {
                        monthsByQuarter[quarterNum] = [];
                    }
                    monthsByQuarter[quarterNum].push(month);
                });
                
                // Create quarters
                for (let q = 1; q <= 4; q++) {
                    const quarterDiv = document.createElement('div');
                    quarterDiv.className = 'quarter';
                    
                    const quarterHeader = document.createElement('div');
                    quarterHeader.className = 'quarter-header';
                    quarterHeader.textContent = `Q${q} (${fiscalYear})`;
                    quarterDiv.appendChild(quarterHeader);
                    
                    const monthGrid = document.createElement('div');
                    monthGrid.className = 'month-grid';
                    
                    // Add months for this quarter
                    const quarterMonths = monthsByQuarter[q] || [];
                    quarterMonths.forEach(month => {
                        const monthDiv = document.createElement('div');
                        monthDiv.className = 'month';
                        
                        const monthHeader = document.createElement('div');
                        monthHeader.className = 'month-header';
                        monthHeader.textContent = month.name;
                        monthDiv.appendChild(monthHeader);
                        
                        // Create mini calendar for the month
                        const monthStart = new Date(month.startTime);
                        const monthEnd = new Date(month.endTime);
                        
                        // Get first day of the month and adjust to start of week
                        const firstDay = new Date(monthStart);
                        const firstDayOfWeek = firstDay.getDay(); // 0 = Sunday, 1 = Monday, etc.
                        const daysToSubtract = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1; // Adjust for Monday start
                        firstDay.setDate(firstDay.getDate() - daysToSubtract);
                        
                        // Create weeks grid
                        const weeksDiv = document.createElement('div');
                        weeksDiv.className = 'weeks';
                        
                        // Add day headers
                        const dayNames = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
                        dayNames.forEach(day => {
                            const dayHeader = document.createElement('div');
                            dayHeader.className = 'day day-header';
                            dayHeader.textContent = day;
                            weeksDiv.appendChild(dayHeader);
                        });
                        
                        // Add days
                        const currentDate = new Date(firstDay);
                        const today = new Date();
                        today.setHours(0, 0, 0, 0);
                        
                        // Generate 6 weeks (42 days) to ensure we cover the month
                        for (let i = 0; i < 42; i++) {
                            const dayDiv = document.createElement('div');
                            dayDiv.className = 'day';
                            
                            // Check if weekend
                            const dayOfWeek = currentDate.getDay();
                            if (dayOfWeek === 0 || dayOfWeek === 6) {
                                dayDiv.classList.add('weekend');
                            }
                            
                            // Check if day is in current month
                            const currentMonth = currentDate.getMonth();
                            const displayMonth = monthStart.getMonth();
                            
                            if (currentMonth === displayMonth) {
                                dayDiv.textContent = currentDate.getDate();
                                
                                // Check if today
                                if (currentDate.getTime() === today.getTime()) {
                                    dayDiv.classList.add('today');
                                }
                                
                                // Check if fiscal year start or end
                                const currentDateStr = currentDate.toISOString().split('T')[0];
                                const fiscalStartStr = new Date(startDate).toISOString().split('T')[0];
                                const fiscalEndStr = new Date(endDate).toISOString().split('T')[0];
                                
                                if (currentDateStr === fiscalStartStr) {
                                    dayDiv.classList.add('fiscal-start');
                                }
                                
                                if (currentDateStr === fiscalEndStr) {
                                    dayDiv.classList.add('fiscal-end');
                                }
                                
                                // Add tooltip data
                                const dateStr = currentDate.toLocaleDateString();
                                const dayInfo = `${dateStr}`;
                                dayDiv.setAttribute('data-tooltip', dayInfo);
                                
                                // Show tooltip on hover
                                dayDiv.addEventListener('mouseenter', function() {
                                    tooltip.textContent = this.getAttribute('data-tooltip');
                                    tooltip.style.opacity = 1;
                                });
                                
                                dayDiv.addEventListener('mouseleave', function() {
                                    tooltip.style.opacity = 0;
                                });
                            }
                            
                            weeksDiv.appendChild(dayDiv);
                            
                            // Move to next day
                            currentDate.setDate(currentDate.getDate() + 1);
                        }
                        
                        monthDiv.appendChild(weeksDiv);
                        monthGrid.appendChild(monthDiv);
                    });
                    
                    quarterDiv.appendChild(monthGrid);
                    calendarGrid.appendChild(quarterDiv);
                }
            }
        });
    </script>
</body>
</html>
