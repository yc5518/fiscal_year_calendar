<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiscal Year Timeline Visualization</title>
  <style>
    :root {
      /* Theme variables - can be customized */
      --primary-color: #3498db;
      --secondary-color: #2ecc71;
      --background-color: #f8f9fa;
      --text-color: #2c3e50;
      --border-color: #ddd;
      --quarter-colors: #3498db, #2ecc71, #e74c3c, #f39c12;
      --hover-color: #ecf0f1;
      --today-color: #e74c3c;
    }
    
    /* Dark theme */
    .dark-theme {
      --primary-color: #3498db;
      --secondary-color: #2ecc71;
      --background-color: #2c3e50;
      --text-color: #ecf0f1;
      --border-color: #34495e;
      --quarter-colors: #3498db, #2ecc71, #e74c3c, #f39c12;
      --hover-color: #34495e;
      --today-color: #e74c3c;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--background-color);
      color: var(--text-color);
      transition: all 0.3s ease;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .controls {
      display: flex;
      gap: 10px;
    }
    
    select, button {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: var(--background-color);
      color: var(--text-color);
      cursor: pointer;
    }
    
    button:hover {
      background-color: var(--hover-color);
    }
    
    .timeline {
      position: relative;
      margin-top: 40px;
      margin-bottom: 40px;
    }
    
    .timeline-track {
      height: 8px;
      background-color: var(--border-color);
      border-radius: 4px;
      position: relative;
    }
    
    .timeline-quarters {
      display: flex;
      height: 100%;
    }
    
    .timeline-quarter {
      flex: 1;
      height: 100%;
      border-radius: 4px;
      position: relative;
    }
    
    .timeline-quarter:nth-child(1) { background-color: var(--primary-color); }
    .timeline-quarter:nth-child(2) { background-color: var(--secondary-color); }
    .timeline-quarter:nth-child(3) { background-color: #e74c3c; }
    .timeline-quarter:nth-child(4) { background-color: #f39c12; }
    
    .timeline-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }
    
    .timeline-label {
      font-size: 14px;
      color: var(--text-color);
      position: relative;
    }
    
    .timeline-months {
      display: flex;
      margin-top: 30px;
    }
    
    .timeline-month {
      flex: 1;
      padding: 10px;
      text-align: center;
      border: 1px solid var(--border-color);
      border-right: none;
      background-color: var(--background-color);
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .timeline-month:last-child {
      border-right: 1px solid var(--border-color);
    }
    
    .timeline-month:hover {
      background-color: var(--hover-color);
    }
    
    .timeline-month.current {
      font-weight: bold;
      border-bottom: 3px solid var(--today-color);
    }
    
    .timeline-today {
      position: absolute;
      top: -20px;
      width: 2px;
      height: 48px;
      background-color: var(--today-color);
      z-index: 10;
    }
    
    .timeline-today::after {
      content: 'Today';
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      white-space: nowrap;
      color: var(--today-color);
    }
    
    .calendar-grid {
      margin-top: 40px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      overflow: hidden;
    }
    
    .calendar-header {
      display: flex;
      background-color: var(--primary-color);
      color: white;
      font-weight: bold;
    }
    
    .calendar-header-cell {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-right: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .calendar-row {
      display: flex;
      border-bottom: 1px solid var(--border-color);
    }
    
    .calendar-row:last-child {
      border-bottom: none;
    }
    
    .calendar-cell {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-right: 1px solid var(--border-color);
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .calendar-cell:last-child {
      border-right: none;
    }
    
    .calendar-cell:hover {
      background-color: var(--hover-color);
    }
    
    .calendar-cell.today {
      background-color: rgba(231, 76, 60, 0.1);
      font-weight: bold;
    }
    
    .calendar-cell.different-month {
      color: #999;
    }
    
    .tooltip {
      position: absolute;
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 14px;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      max-width: 250px;
    }
    
    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 24px;
      color: var(--text-color);
      padding: 0;
      margin-left: 10px;
    }
    
    @media (max-width: 768px) {
      .timeline-month {
        font-size: 12px;
        padding: 8px 4px;
      }
      
      .calendar-cell {
        padding: 6px 4px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Fiscal Year Timeline</h1>
      <div class="controls">
        <select id="fiscal-year-select">
          <option value="2023">FY 2023</option>
          <option value="2024">FY 2024</option>
          <option value="2025" selected>FY 2025</option>
          <option value="2026">FY 2026</option>
        </select>
        <select id="preset-select">
          <option value="us-federal">US Federal</option>
          <option value="uk-standard">UK Standard</option>
          <option value="australia">Australia</option>
          <option value="calendar-year">Calendar Year</option>
          <option value="retail-standard">Retail Standard</option>
        </select>
        <button id="theme-toggle" class="theme-toggle">🌙</button>
      </div>
    </div>
    
    <div class="timeline">
      <div class="timeline-track">
        <div class="timeline-quarters">
          <div class="timeline-quarter" data-quarter="1"></div>
          <div class="timeline-quarter" data-quarter="2"></div>
          <div class="timeline-quarter" data-quarter="3"></div>
          <div class="timeline-quarter" data-quarter="4"></div>
        </div>
        <div class="timeline-today" id="timeline-today"></div>
      </div>
      <div class="timeline-labels">
        <div class="timeline-label" id="start-date">Oct 1, 2024</div>
        <div class="timeline-label" id="end-date">Sep 30, 2025</div>
      </div>
    </div>
    
    <div class="timeline-months" id="timeline-months">
      <!-- Months will be inserted here by JavaScript -->
    </div>
    
    <div class="calendar-grid" id="calendar-grid">
      <!-- Calendar will be inserted here by JavaScript -->
    </div>
    
    <div class="tooltip" id="tooltip"></div>
  </div>
  
  <script>
    // Fiscal Year Calendar Visualization
    class FiscalYearTimeline {
      constructor(options = {}) {
        this.options = {
          fiscalYear: 2025,
          presetKey: 'us-federal',
          showToday: true,
          ...options
        };
        
        this.presets = {
          'us-federal': {
            name: 'US Federal Government',
            fyStartMonth: 9, // October (0-based)
            fyStartDay: 1,
            description: 'US Federal Government fiscal year (Oct 1 - Sep 30)'
          },
          'uk-standard': {
            name: 'UK Standard',
            fyStartMonth: 3, // April (0-based)
            fyStartDay: 6,
            description: 'UK standard fiscal year (Apr 6 - Apr 5)'
          },
          'australia': {
            name: 'Australia',
            fyStartMonth: 6, // July (0-based)
            fyStartDay: 1,
            description: 'Australian fiscal year (Jul 1 - Jun 30)'
          },
          'calendar-year': {
            name: 'Calendar Year',
            fyStartMonth: 0, // January (0-based)
            fyStartDay: 1,
            description: 'Standard calendar year (Jan 1 - Dec 31)'
          },
          'retail-standard': {
            name: 'Retail Standard',
            fyStartMonth: 1, // February (0-based)
            fyStartDay: 1,
            description: 'Standard retail fiscal year (Feb 1 - Jan 31)'
          }
        };
        
        this.monthNames = [
          'January', 'February', 'March', 'April', 'May', 'June',
          'July', 'August', 'September', 'October', 'November', 'December'
        ];
        
        this.dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        
        this.today = new Date();
        this.currentPreset = this.presets[this.options.presetKey];
        
        this.initElements();
        this.initEventListeners();
        this.render();
      }
      
      initElements() {
        this.fiscalYearSelect = document.getElementById('fiscal-year-select');
        this.presetSelect = document.getElementById('preset-select');
        this.timelineMonths = document.getElementById('timeline-months');
        this.calendarGrid = document.getElementById('calendar-grid');
        this.startDateLabel = document.getElementById('start-date');
        this.endDateLabel = document.getElementById('end-date');
        this.timelineToday = document.getElementById('timeline-today');
        this.tooltip = document.getElementById('tooltip');
        this.themeToggle = document.getElementById('theme-toggle');
        
        // Set initial values
        this.fiscalYearSelect.value = this.options.fiscalYear;
        this.presetSelect.value = this.options.presetKey;
      }
      
      initEventListeners() {
        this.fiscalYearSelect.addEventListener('change', () => {
          this.options.fiscalYear = parseInt(this.fiscalYearSelect.value);
          this.render();
        });
        
        this.presetSelect.addEventListener('change', () => {
          this.options.presetKey = this.presetSelect.value;
          this.currentPreset = this.presets[this.options.presetKey];
          this.render();
        });
        
        this.themeToggle.addEventListener('click', () => {
          document.body.classList.toggle('dark-theme');
          this.themeToggle.textContent = document.body.classList.contains('dark-theme') ? '☀️' : '🌙';
        });
        
        document.addEventListener('mousemove', (e) => {
          this.tooltip.style.left = `${e.pageX + 15}px`;
          this.tooltip.style.top = `${e.pageY + 15}px`;
        });
      }
      
      render() {
        this.renderTimeline();
        this.renderMonths();
        this.renderCalendar();
        
        if (this.options.showToday) {
          this.showTodayMarker();
        }
      }
      
      renderTimeline() {
        const { fyStartMonth, fyStartDay } = this.currentPreset;
        const fiscalYear = this.options.fiscalYear;
        
        // Calculate start and end dates
        const startDate = new Date(fiscalYear - 1, fyStartMonth, fyStartDay);
        const endDate = new Date(fiscalYear, fyStartMonth, fyStartDay);
        endDate.setDate(endDate.getDate() - 1);
        
        // Update labels
        this.startDateLabel.textContent = this.formatDate(startDate);
        this.endDateLabel.textContent = this.formatDate(endDate);
        
        // Update quarters
        const quarters = document.querySelectorAll('.timeline-quarter');
        quarters.forEach((quarter, index) => {
          const quarterStartMonth = (fyStartMonth + index * 3) % 12;
          const quarterStartYear = fiscalYear - 1 + Math.floor((fyStartMonth + index * 3) / 12);
          const quarterStart = new Date(quarterStartYear, quarterStartMonth, 1);
          
          const quarterEndMonth = (quarterStartMonth + 3) % 12;
          const quarterEndYear = quarterStartYear + Math.floor((quarterStartMonth + 3) / 12);
          const quarterEnd = new Date(quarterEndYear, quarterEndMonth, 0);
          
          quarter.setAttribute('data-tooltip', `Q${index + 1}: ${this.formatDate(quarterStart)} - ${this.formatDate(quarterEnd)}`);
          
          quarter.addEventListener('mouseenter', () => {
            this.tooltip.textContent = quarter.getAttribute('data-tooltip');
            this.tooltip.style.opacity = 1;
          });
          
          quarter.addEventListener('mouseleave', () => {
            this.tooltip.style.opacity = 0;
          });
        });
      }
      
      renderMonths() {
        const { fyStartMonth, fyStartDay } = this.currentPreset;
        const fiscalYear = this.options.fiscalYear;
        
        this.timelineMonths.innerHTML = '';
        
        for (let i = 0; i < 12; i++) {
          const monthIndex = (fyStartMonth + i) % 12;
          const monthYear = fiscalYear - 1 + Math.floor((fyStartMonth + i) / 12);
          const monthStart = new Date(monthYear, monthIndex, 1);
          const monthEnd = new Date(monthYear, monthIndex + 1, 0);
          
          const monthElement = document.createElement('div');
          monthElement.className = 'timeline-month';
          monthElement.textContent = this.monthNames[monthIndex].substring(0, 3);
          monthElement.setAttribute('data-tooltip', `${this.monthNames[monthIndex]} ${monthYear}: ${this.formatDate(monthStart)} - ${this.formatDate(monthEnd)}`);
          
          // Check if this is the current month
          const now = new Date();
          if (now.getFullYear() === monthYear && now.getMonth() === monthIndex) {
            monthElement.classList.add('current');
          }
          
          monthElement.addEventListener('mouseenter', () => {
            this.tooltip.textContent = monthElement.getAttribute('data-tooltip');
            this.tooltip.style.opacity = 1;
          });
          
          monthElement.addEventListener('mouseleave', () => {
            this.tooltip.style.opacity = 0;
          });
          
          this.timelineMonths.appendChild(monthElement);
        }
      }
      
      renderCalendar() {
        const { fyStartMonth, fyStartDay } = this.currentPreset;
        const fiscalYear = this.options.fiscalYear;
        
        // Clear existing calendar
        this.calendarGrid.innerHTML = '';
        
        // Create header
        const header = document.createElement('div');
        header.className = 'calendar-header';
        
        this.dayNames.forEach(day => {
          const cell = document.createElement('div');
          cell.className = 'calendar-header-cell';
          cell.textContent = day;
          header.appendChild(cell);
        });
        
        this.calendarGrid.appendChild(header);
        
        // Create calendar rows
        const startDate = new Date(fiscalYear - 1, fyStartMonth, fyStartDay);
        const endDate = new Date(fiscalYear, fyStartMonth, fyStartDay);
        endDate.setDate(endDate.getDate() - 1);
        
        let currentDate = new Date(startDate);
        currentDate.setDate(currentDate.getDate() - currentDate.getDay()); // Start from Sunday
        
        while (currentDate <= endDate) {
          const row = document.createElement('div');
          row.className = 'calendar-row';
          
          for (let i = 0; i < 7; i++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-cell';
            
            // Check if date is within fiscal year
            if (currentDate < startDate || currentDate > endDate) {
              cell.classList.add('different-month');
            }
            
            // Check if this is today
            const today = new Date();
            if (currentDate.getDate() === today.getDate() &&
                currentDate.getMonth() === today.getMonth() &&
                currentDate.getFullYear() === today.getFullYear()) {
              cell.classList.add('today');
            }
            
            cell.textContent = currentDate.getDate();
            cell.setAttribute('data-tooltip', this.formatDate(currentDate));
            
            cell.addEventListener('mouseenter', () => {
              this.tooltip.textContent = cell.getAttribute('data-tooltip');
              this.tooltip.style.opacity = 1;
            });
            
            cell.addEventListener('mouseleave', () => {
              this.tooltip.style.opacity = 0;
            });
            
            row.appendChild(cell);
            
            // Move to next day
            currentDate = new Date(currentDate);
            currentDate.setDate(currentDate.getDate() + 1);
          }
          
          this.calendarGrid.appendChild(row);
          
          // Break if we've gone past the end date and completed the week
          if (currentDate > endDate && currentDate.getDay() === 0) {
            break;
          }
        }
      }
      
      showTodayMarker() {
        const { fyStartMonth, fyStartDay } = this.currentPreset;
        const fiscalYear = this.options.fiscalYear;
        
        const startDate = new Date(fiscalYear - 1, fyStartMonth, fyStartDay);
        const endDate = new Date(fiscalYear, fyStartMonth, fyStartDay);
        endDate.setDate(endDate.getDate() - 1);
        
        const today = new Date();
        
        // Only show marker if today is within the fiscal year
        if (today >= startDate && today <= endDate) {
          const totalDays = (endDate.getTime() - startDate.getTime()) / (1000 * 60 * 60 * 24);
          const daysPassed = (today.getTime() - startDate.getTime()) / (1000 * 60 * 60 * 24);
          const percentage = (daysPassed / totalDays) * 100;
          
          this.timelineToday.style.left = `${percentage}%`;
          this.timelineToday.style.display = 'block';
        } else {
          this.timelineToday.style.display = 'none';
        }
      }
      
      formatDate(date) {
        const options = { year: 'numeric', month: 'short', day: 'numeric' };
        return date.toLocaleDateString(undefined, options);
      }
    }
    
    // Initialize the timeline
    document.addEventListener('DOMContentLoaded', () => {
      const timeline = new FiscalYearTimeline({
        fiscalYear: 2025,
        presetKey: 'us-federal',
        showToday: true
      });
    });
  </script>
</body>
</html>
